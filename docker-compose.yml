services:
  korus:
    image: ghcr.io/aunali321/korus:latest
    # build: .  # Uncomment to build locally instead
    container_name: korus
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - korus_data:/data
      - /path/to/your/music:/media:ro
    environment:
      - ADDR=:8080
      - DB_PATH=/data/korus.db
      - MEDIA_ROOT=/media
      - JWT_SECRET=changeme-use-a-secure-random-string
      - TOKEN_TTL=24h
      - REFRESH_TTL=720h
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=changeme
      - ADMIN_EMAIL=admin@example.com
      - SCAN_WATCH=true
      - SCAN_EMBEDDED_COVER=true
      - ENABLE_MUSICBRAINZ=false
      - ENABLE_LISTENBRAINZ=false

  # Discord bot. Separate image: it links libdave, which is glibc-only.
  korus-bot:
    image: ghcr.io/aunali321/korus-bot:latest
    container_name: korus-bot
    restart: unless-stopped
    depends_on:
      - korus
    volumes:
      - korus_data:/data
    environment:
      - DISCORD_TOKEN=your-bot-token
      # Set to a server id for instant command updates while developing.
      - DISCORD_GUILD_ID=
      - BOT_DB_PATH=/data/bot.db

volumes:
  korus_data:
